server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable; index.html and config.json never are. Caching either one is how a
    # deployment appears to have half-succeeded.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /config.json {
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: any unknown path is a route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
