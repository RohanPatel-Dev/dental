name: frontend

on:
  push:
    branches: [main]
    paths:
      - 'clients/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'clients/**'
      - '.github/workflows/frontend.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      # Both SPAs are independent applications, so they are independent jobs: a broken operator
      # console should not hide a passing practice app.
      matrix:
        app: [admin, dashboard]

    defaults:
      run:
        working-directory: clients/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/${{ matrix.app }}/package-lock.json

      - run: npm ci

      - run: npm run lint

      # `npm run build` type-checks first, so a type error fails here rather than at runtime.
      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.app }}
          path: clients/${{ matrix.app }}/playwright-report
          retention-days: 7
